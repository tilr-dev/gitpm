[package]
name = "gitpm-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "UniFFI bindings (Swift/Kotlin) for gitpm"

[lib]
name = "gitpm_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
gitpm = { path = "../gitpm" }
thiserror = "2"
uniffi = "0.32.2"
