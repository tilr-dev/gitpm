[package]
name = "tilr-plugin-manager"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tilr plugin manager core: Git-based installs, releases, catalog and workspace transactions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
libc = "0.2"
pubgrub = "0.4"
semver = "1"
