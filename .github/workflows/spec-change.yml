name: Specification authorization

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-change:
    name: spec-change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch specification trees without a checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/spec-inspection.git"
          git -C "$RUNNER_TEMP/spec-inspection.git" remote add origin "https://github.com/$REPOSITORY.git"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          # Compare dev with GitHub's test merge of the PR, not with the branch tip: a branch that
          # is behind dev would otherwise "remove" every requirement dev gained after it forked.
          # The helper tells a conflict with dev from a merge result GitHub has not updated yet.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/main/scripts/spec_merge.py \
            --output "$RUNNER_TEMP/spec_merge.py"
          printf 'd11656ef7f180b3a423837a8272e0195be1fe1f8de171875f7a81f3a165b6385  %s\n' "$RUNNER_TEMP/spec_merge.py" | sha256sum --check --strict
          python3 "$RUNNER_TEMP/spec_merge.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --branch "$TASK_BRANCH"
      - name: Download the content-pinned shared checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tilr-dev/gitpm/main/scripts/spec_change.py \
            --output "$RUNNER_TEMP/spec_change.py"
          printf 'd27166908553b740351c8105555351792fa9a810f79c092369e684acbe1bd27a  %s\n' "$RUNNER_TEMP/spec_change.py" | sha256sum --check --strict
      - name: Authorize specification changes
        env:
          ITSAPLAN_READ_ONLY_TOKEN: ${{ secrets.ITSAPLAN_READ_ONLY_TOKEN }}
          TASK_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/spec_change.py" \
            --repo "$RUNNER_TEMP/spec-inspection.git" \
            --component gitpm \
            --base refs/inspection/base --head refs/inspection/merge \
            --branch "$TASK_BRANCH"
