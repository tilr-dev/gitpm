# Releases: release-please keeps a release PR open from the Conventional Commits on main
# (version bump in crates/gitpm/Cargo.toml and Cargo.lock, CHANGELOG); merging it
# tags vX.Y.Z and creates the GitHub release, and `publish` then publishes that tag to crates.io.
# Only the core crate is released; the FFI crate (publish = false) keeps its own version.
# Cargo.lock is bumped through an extra-files TOML jsonpath in release-please-config.json: the
# `rust` strategy only updates a Cargo.lock next to the crate, and the cargo-workspace plugin
# would also release the FFI crate as a dependent. The filter reads `@.name.value` because
# release-please parses TOML into position-tagged values (checked with release-please 17.6.0,
# the version release-please-action v5.0.0 bundles, and 17.11.2).
#
# The release-please job acts as the org GitHub App tilr-bot (a short-lived installation token
# from actions/create-github-app-token, scoped to this repository): the release PR is opened by
# tilr-bot, not by the GITHUB_TOKEN, so CI runs on it like on any PR. There is no bypass: the
# release PR goes through the same required checks, and merging it is the release approval.
#
# publish: crates.io trusted publishing (OIDC, no long-lived CARGO_REGISTRY_TOKEN secret).
# The crate's trusted publisher on crates.io is bound to this repository, this file
# (release.yml) and the `crates-io` environment. That environment is restricted to `main` and
# has no required reviewer (org decision, as in plugin-sdk): the merged release PR is the gate.
# rust-lang/crates-io-auth-action exchanges the job's OIDC token for a short-lived publish token.
# Trusted publishing can only be configured for a crate that already exists, so the first
# version (0.1.0) is published by hand (`cargo publish -p gitpm`) and tagged v0.1.0;
# release-please starts from there (.release-please-manifest.json).
# `publish` runs in this workflow, gated on release-please's `release_created`, rather than on
# `release: published`, so the trusted publisher stays bound to release.yml.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read # all writes go through the tilr-bot token below
    # The package lives at crates/gitpm, not ".", so release-please-action prefixes its
    # per-release outputs with the path (`crates/gitpm--release_created`, ...).
    outputs:
      release_created: ${{ steps.release.outputs['crates/gitpm--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/gitpm--tag_name'] }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TILR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TILR_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release PR's branch, the tag, the GitHub release
          permission-pull-requests: write # the release PR
          permission-issues: write # release-please's labels on the release PR
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install Rust (stable, rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # As in ci.yml, on the tagged commit. No cache: a release build starts clean.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p gitpm --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
