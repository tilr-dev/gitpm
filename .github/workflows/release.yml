# Release branches create RC prereleases; owner-created stable tags publish to crates.io.
# The shared workflow validates stable tags against release/X.Y before downstream jobs run.
# Each checkout sets all crate versions from the tag without committing version changes.
# Trusted Publishing uses OIDC and the crates-io environment; reruns skip published crates.
# Read-only builds produce CLI and Apple archives; only upload gets asset write permission.
name: release

on:
  push:
    branches: ['release/**']
    tags: ['v*', '!v*-rc.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: read
    uses: tilr-dev/.github/.github/workflows/release-branch.yml@c31b80fcfd5cb9398a193d422c212326302d0c44
    with:
      workflow-sha: c31b80fcfd5cb9398a193d422c212326302d0c44
      app-client-id: ${{ vars.TILR_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.TILR_BOT_PRIVATE_KEY }}

  publish:
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.is_rc == 'false' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Set crate versions from the release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/set-release-version.py "$RELEASE_TAG"
      - name: Install Rust (stable, rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # As in ci.yml, on the tagged commit. No cache: a release build starts clean.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # gitpm first: gitpm-cli depends on the same gitpm version, and its verify build resolves
      # it from crates.io. Since cargo 1.66, `cargo publish` blocks until the new version is in
      # the index (60 s timeout, configurable only on nightly: -Zpublish-timeout), so the
      # second publish sees the first without a sleep. If that wait times out, cargo only
      # warns; gitpm-cli's verify then fails and the job can be re-run: a version already on
      # crates.io (checked in the sparse index) is skipped, since crates.io refuses re-uploads.
      - name: Publish gitpm, then gitpm-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          for crate in gitpm gitpm-cli; do
            if curl -sSfL "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "$crate" --locked --allow-dirty
          done

  # Stable uploads wait for crates.io publication. Candidates skip crates.io and upload
  # after their build succeeds; !cancelled() allows that skipped dependency.
  build:
    needs: release
    if: needs.release.outputs.tag != ''
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64 macOS runner; x86_64 is cross-compiled there (the macOS SDK has both
          # architectures), so the build does not depend on an Intel runner image.
          - { target: aarch64-apple-darwin, os: macos-15, native: true }
          - { target: x86_64-apple-darwin, os: macos-15, native: false }
          # Native Linux runners (ubuntu-22.04-arm is free for public repositories). 22.04, not
          # 24.04: the binary needs the glibc it was linked against or newer, and 22.04's
          # (2.35) also covers Debian 12 and Ubuntu 22.04 hosts.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, native: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Set crate versions from the release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/set-release-version.py "$RELEASE_TAG"
      - name: Install Rust (stable, ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      # No cache, as in publish: a release build starts clean.
      - run: GITPM_BUILD_VERSION="${TAG#v}" cargo build --release --locked -p gitpm-cli --target "$TARGET"
      - name: Check the version
        if: matrix.native
        run: test "$(target/"$TARGET"/release/gitpm --version)" = "gitpm ${TAG#v}"
      - run: scripts/package-cli.sh "$TAG" "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitpm-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-apple:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Set crate versions from the release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/set-release-version.py "$RELEASE_TAG"
      - name: Install Rust (stable, both Apple targets)
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - name: Build universal Apple FFI and Swift bindings
        run: scripts/build-apple.sh --release
      - name: Package Apple FFI
        run: scripts/package-apple.sh "$TAG" target/apple dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitpm-ffi-universal-apple-darwin
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [release, publish, build, build-apple]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      needs.build-apple.result == 'success' &&
      (needs.publish.result == 'success' || needs.release.outputs.is_rc == 'true') &&
      needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload; nothing else in this job runs repository code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gitpm-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      # --clobber: a re-run replaces the assets of a failed or partial upload.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
