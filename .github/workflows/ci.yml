# CI: format, lint, tests, MSRV, cargo-deny and gitleaks on every PR, merge queue group and push
# to a release branch (release/**), nightly on main and on manual runs. There is no run on push to
# main: the merge queue has already checked exactly the commit that lands there.
# Two tiers, the same jobs and required check names: on a pull request into main `test` runs the
# fast tier (nextest profile `pr` in .config/nextest.toml leaves out the long scenario tests), as
# the merge queue then runs every test on the commit that lands; every other event, a pull request
# into release/** included (release branches have no merge queue), runs every test.
# Caches: a PR can restore only caches of its own ref and of main, not those written in the merge
# queue (gh-readonly-queue/*), so the queue does not save them and the nightly run on main keeps
# the rust-cache entries warm for PRs.
# The whole workspace runs on ubuntu-latest, the UniFFI crate included (uniffi is portable;
# only scripts/build-apple.sh is macOS-specific and is not run here).
# Only `pull_request` (never pull_request_target): a PR's code runs without secrets.
# Rust comes from the runner's rustup (no third-party toolchain action); tools are downloaded
# at pinned versions and checked against pinned SHA-256 sums.
name: ci

on:
  merge_group:
  pull_request:
    branches: [main, 'release/**']
    # edited: a PR retargeted from main to release/** must rerun with the full tier.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['release/**']
  schedule:
    - cron: '17 2 * * *' # nightly full run on main (scheduled runs use the default branch)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  release-line:
    name: release line regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - run: node --test .github/release-workflow.test.cjs

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable, rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # nextest profile: the fast tier only on a pull request into main (the merge queue follows).
      TIER: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'pr' || 'default' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Install cargo-nextest
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  $RUNNER_TEMP/cargo-nextest.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tgz" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          NEXTEST_VERSION: 0.9.150
          NEXTEST_SHA256: b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
      # The tests shell out to the runner's git; .cargo/config.toml points them at
      # tests/gitconfig (nextest applies its [env] as cargo test does), so the runner's
      # Git config does not matter. Every test binary is built in both tiers.
      - name: Run tests (pull request into main — fast tier, otherwise all)
        run: cargo nextest run --workspace --locked --profile "$TIER"
      # nextest does not run doctests; the full tier runs them with cargo.
      - if: env.TIER == 'default'
        run: cargo test --workspace --locked --doc
      - name: Test specification workflow event routing and CI tiers
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-tests"
          "$RUNNER_TEMP/workflow-tests/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/workflow-tests/bin/python" scripts/test_spec_change_workflow.py
          "$RUNNER_TEMP/workflow-tests/bin/python" scripts/test_ci_workflow.py
      # Smoke test of the CLI binary as installed: the binary is already built for the
      # tests above (no rebuild); its tests cover --help, this checks --version against
      # the crate version (kept in lockstep with gitpm).
      - name: Smoke test gitpm binary
        run: |
          cargo build -p gitpm-cli --locked
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "gitpm-cli") | .version')
          # A commit that is not a release tag reports VERSION-dev+HASH (build.rs).
          case "$(target/debug/gitpm --version)" in
            "gitpm $version" | "gitpm $version-dev+"[0-9a-f]*) ;;
            *) target/debug/gitpm --version; exit 1 ;;
          esac
          target/debug/gitpm --help >/dev/null

  msrv:
    # The name is a required check in the main ruleset; keep it when the scope changes.
    name: msrv (core crate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with `rust-version` in Cargo.toml ([workspace.package]).
      - name: Install Rust (MSRV)
        run: |
          rustup toolchain install 1.92 --profile minimal
          rustup default 1.92
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # The published crates; gitpm-ffi is not published and is not checked on the MSRV.
      - run: cargo check -p gitpm -p gitpm-cli --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP" --strip-components=1 \
            "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "CARGO_DENY=$RUNNER_TEMP/cargo-deny" >> "$GITHUB_ENV"
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      # deny.toml: advisories (RustSec), licenses, bans, sources.
      - run: '"$CARGO_DENY" --locked check'

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history of HEAD; this also fetches every other branch
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # Default git log --all includes unrelated fetched branches. Scan only HEAD's ancestry.
      - run: '"$GITLEAKS" git --redact --no-banner --exit-code 1 --log-opts=HEAD .'
      - name: Test gitleaks history scope
        run: python3 scripts/test_gitleaks_workflow.py

  # Additional black-box coverage; never a required PR/merge-queue check.
  itests:
    name: itests
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DAGGER_VERSION: 0.21.10
      DAGGER_SHA256: f9ee083767dd12cdac583f9db3fedbebbbb3064f69152998be1f121d1a6cc103
      DT_ENGINE: dagger
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://gitpm-itests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Dagger CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/dagger.tgz" \
            "https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          echo "${DAGGER_SHA256}  $RUNNER_TEMP/dagger.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/dagger.tgz" -C "$RUNNER_TEMP/bin" dagger
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install report tools
        run: |
          python3 -m venv "$RUNNER_TEMP/report-tools"
          "$RUNNER_TEMP/report-tools/bin/pip" install uv==0.6.6
          echo "$RUNNER_TEMP/report-tools/bin" >> "$GITHUB_PATH"
      # The engine owns cargo home and source-specific target cache volumes. Cache its
      # stopped state, not the host target/ directory (which Dagger never uses).
      - name: Restore Dagger cache
        id: dagger-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dagger-cache.tar
          key: itests-${{ runner.os }}-${{ runner.arch }}-${{ env.DAGGER_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            itests-${{ runner.os }}-${{ runner.arch }}-${{ env.DAGGER_VERSION }}-
      - name: Start local Dagger engine
        run: |
          mkdir -p "$RUNNER_TEMP/dagger-state"
          if [ -f "$RUNNER_TEMP/dagger-cache.tar" ]; then
            sudo tar --numeric-owner --xattrs -xpf "$RUNNER_TEMP/dagger-cache.tar" -C "$RUNNER_TEMP/dagger-state"
          fi
          docker run -d --name gitpm-itests --privileged \
            -v "$RUNNER_TEMP/dagger-state:/var/lib/dagger" \
            "registry.dagger.io/engine:v${DAGGER_VERSION}"
      # Two concurrent tests; compilation in the module also uses two cargo jobs.
      - name: Run the complete Dagger suite
        run: env -u SSH_AUTH_SOCK itests/dt --jobs 2
      - name: Upload Dagger results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itests-results
          path: itests/results/
          if-no-files-found: warn
      - name: Stop local Dagger engine
        if: always()
        run: |
          if docker container inspect gitpm-itests >/dev/null 2>&1; then
            docker stop gitpm-itests
          fi
      - name: Export stopped Dagger cache
        if: success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          sudo tar --numeric-owner --xattrs --sparse -cpf "$RUNNER_TEMP/dagger-cache.tar" -C "$RUNNER_TEMP/dagger-state" .
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/dagger-cache.tar"
      - name: Save Dagger cache
        if: success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dagger-cache.tar
          key: ${{ steps.dagger-cache.outputs.cache-primary-key }}
